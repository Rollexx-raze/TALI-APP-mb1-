<ion-footer class="page-footer bottom-nav-footer ion-no-border">
  <ion-toolbar>
    <nav class="page-nav" aria-label="Main navigation">
      @for (tab of tabs; track tab.key) {
        <ion-button
          fill="clear"
          class="nav-tab"
          [class.nav-create]="tab.key === 'create'"
          [class.is-active]="isActive(tab)"
          [routerLink]="tab.path"
          [attr.aria-label]="tab.label"
          [attr.aria-current]="isActive(tab) ? 'page' : null"
          (click)="onTabTap(tab)"
        >
          <span class="nav-icon-circle">
          @switch (tab.key) {
            @case ('home') {
              <svg class="nav-icon nav-icon-home" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
            }
            @case ('explore') {
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 4a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
            }
            @case ('create') {
              <svg class="nav-icon nav-plus-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            }
            @case ('activity') {
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
              @if (unreadNotifications) { <span class="notification-badge">{{ unreadNotifications }}</span> }
            }
            @case ('profile') {
              <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9" r="3"/><path d="M7 20a5 5 0 0 1 10 0"/></svg>
            }
          }
          </span>
        </ion-button>
      }
    </nav>
  </ion-toolbar>
</ion-footer>
