<ion-header class="ion-no-border">
  <ion-toolbar class="topbar">
    <ion-title class="app-title">Tali</ion-title>
    <ion-buttons slot="end">
      <ion-button class="profile-button" aria-label="Profile">
        <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="feed-content">
  <div class="content-shell">
    @for (post of posts; track post) {
    <article class="post">
      <ion-avatar class="post-avatar">
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-avatar>

      <div class="post-body">
        <div class="post-header-row">
          <div class="post-identity">
            <span class="post-name">{{ post.name }}</span>
            <span class="post-username">{{ post.username }}</span>
          </div>
          <button class="post-more" type="button" aria-label="More options">•••</button>
        </div>

        <p class="post-text">{{ post.text }}</p>

        @if (post.hasImage) {
        <div class="post-image" aria-label="Post visual"></div>
        }

        <div class="post-actions">
          <span class="action-pill">5</span>
          <span class="action-pill">12</span>
          <span class="action-pill">23</span>
          <span class="action-pill">1</span>
        </div>
      </div>
    </article>
    }
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar class="tab-bar">
    <nav class="page-nav home-nav" aria-label="Main navigation">
      <ion-button fill="solid" class="nav-button is-active" aria-label="Home">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      </ion-button>
      <ion-button fill="clear" class="nav-button" aria-label="Search">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
      </ion-button>
      <ion-button fill="clear" class="nav-button add-button" aria-label="New post">
        <span class="nav-plus-circle"><svg class="nav-plus-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
      </ion-button>
      <ion-button fill="clear" class="nav-button" aria-label="Favorites">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
      </ion-button>
      <ion-button fill="clear" class="nav-button" aria-label="Profile">
        <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="9" r="3"/><path d="M7 20a5 5 0 0 1 10 0"/></svg>
      </ion-button>
    </nav>
  </ion-toolbar>
</ion-footer>
